<div class="layout-container">
  
  <header class="layout-header">
    <div class="left">
      <div class="logo-wrapper">
        <i class="pi pi-shield header-icon"></i>
      </div>
      <h1>Panel de Administración Switchando</h1>
    </div>

    <div class="right">
      <div class="admin-profile">
        <i class="pi pi-user profile-icon"></i>
        <span class="user-greeting">Hola, <strong>{{ adminName }}</strong></span>
      </div>
      <button class="logout-btn" pRipple (click)="logout()" pTooltip="Cerrar sesión" tooltipPosition="bottom">
        <i class="pi pi-sign-out"></i>
      </button>
    </div>
  </header>

  <div class="layout-body">
    
    <aside class="desktop-sidebar" [class.collapsed]="isSidebarCollapsed">
      <div class="sidebar-toggle-wrapper">
        <button
          type="button"
          class="collapse-btn"
          pRipple
          (click)="toggleSidebar()"
          [pTooltip]="isSidebarCollapsed ? 'Expandir menú' : 'Colapsar menú'"
          tooltipPosition="right"
        >
          <i class="pi" [ngClass]="isSidebarCollapsed ? 'pi-bars' : 'pi-angle-left'"></i>
        </button>
      </div>

      <div class="menu-section">
        @if (!isSidebarCollapsed) {
          <h3 class="section-title">Panel Principal</h3>
        }

        <nav class="clean-nav">
          @for (item of internalMenu; track item.label) {
            <a
              pRipple
              class="sidebar-link"
              [routerLink]="item.routerLink"
              routerLinkActive="active-link"
              [pTooltip]="isSidebarCollapsed ? item.label : ''"
              tooltipPosition="right"
            >
              <i class="icon" [class]="item.icon"></i>
              @if (!isSidebarCollapsed) {
                <span class="label">{{ item.label }}</span>
              }
            </a>
          }
        </nav>
      </div>
    </aside>

    <main class="content">
      <div class="content-wrapper">
        <router-outlet></router-outlet>
      </div>
    </main>
    
  </div>
</div>
