<div class="admin-page">
  <div class="page-header">
    <div class="header-left">
      <h1><i class="pi pi-users"></i> Control de Usuarios</h1>
      <p>Buscá usuarios, cambiá sus roles o suspendé cuentas problemáticas.</p>
    </div>
  </div>

  <p-card styleClass="admin-card">
    <div class="table-toolbar">
      <div class="search-box">
        <i class="pi pi-search"></i>
        <input pInputText type="text" [(ngModel)]="searchText" placeholder="Buscar por nombre o correo..." />
      </div>
    </div>

    <p-table 
      [value]="users()" 
      [paginator]="true" 
      [rows]="5" 
      [rowsPerPageOptions]="[5, 10, 20]"
      styleClass="p-datatable-sm modern-admin-table"
      responsiveLayout="scroll"
    >
      <ng-template #header>
        <tr>
          <th>Usuario</th>
          <th>Correo Electrónico</th>
          <th class="text-center">Rol</th>
          <th class="text-center">Estado</th>
          <th>Registro</th>
          <th class="text-center">Acciones</th>
        </tr>
      </ng-template>

      <ng-template #body let-user>
        <tr class="table-row-hover">
          <td>
            <div style="display: flex; align-items: center; gap: 0.75rem;">
              <p-avatar icon="pi pi-user" shape="circle" [style]="{'background-color': '#e5e7eb', 'color': '#4b5563'}"></p-avatar>
              <strong>{{ user.nombre }}</strong>
            </div>
          </td>
          <td class="text-muted">{{ user.correo }}</td>
          <td class="text-center">
            <p-tag [value]="user.rol" [severity]="getRoleSeverity(user.rol)"></p-tag>
          </td>
          <td class="text-center">
            <p-tag [value]="user.estado" [severity]="getStatusSeverity(user.estado)"></p-tag>
          </td>
          <td class="text-muted">{{ user.fechaRegistro | date:'dd/MM/yyyy' }}</td>
          <td class="text-center">
            <div class="action-buttons">
              <p-button icon="pi pi-shield" severity="warn" [text]="true" [rounded]="true" pTooltip="Cambiar Rol"></p-button>
              <p-button icon="pi pi-ban" severity="danger" [text]="true" [rounded]="true" pTooltip="Suspender Cuenta"></p-button>
            </div>
          </td>
        </tr>
      </ng-template>

      <ng-template #empty>
        <tr>
          <td colspan="6" class="empty-state">
            <i class="pi pi-users"></i>
            <p>No se encontraron usuarios.</p>
          </td>
        </tr>
      </ng-template>
    </p-table>
  </p-card>
</div>
