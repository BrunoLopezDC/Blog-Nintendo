<div class="search-bar-container">
  <mat-icon class="search-icon">search</mat-icon>
  <input
    type="text"
    [formControl]="searchControl"
    placeholder="Buscar"
    class="search-input"
    (keyup.enter)="onSearch()"
  />
  <button
    *ngIf="searchControl.value"
    (click)="clearSearch()"
    class="clear-btn"
    type="button"
  >
    <mat-icon>close</mat-icon>
  </button>
</div>
